<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         ul{

            list-style-type: none;
            display: flex;
            flex-direction: column;
            height: 300px;
            
            /* Alinha os elementos no eixo principal que foi definido no flex direction. Por padrão ele vem como row(linha) */
            /*Flex-start  - Alinha os elementos no inicio do conteiner
            */
            /* Center = Alinhas os elementos no centro do conteiner */
            /* Flex-end: no final
            space-between - entre os elementos
            space-arond - espaço ao redor
            space-evenly - um espaço maior ao redor
            space-around - espaço ao redor
            */ 
            justify-content: space-between;
            align-items: center;
            border: 1px solid red;


            padding-inline-end: 1;
            /*gap: 50px;
            */
            
         }



    </style>
</head>
<body>
    

    <ul>
       <li>Victor</li>
       <li>Adilson</li>
       <li>Gabriel</li>
       <li>Pedro</li>



    </ul>
    <ol>
       <li>Segunda</li>
       <li>Terça</li>
       <li>Quarta</li>
       <li>Quinta</li>
       <li>Sexta</li>  
    </ol>
    
</body>
</html>
